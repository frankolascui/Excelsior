# Vista previa: compila la rama elegida y la publica en GitHub Pages (gratis en repos públicos).
# Pages sirve la rama gh-pages (Settings → Pages → Deploy from a branch → gh-pages): esa copia es lo que se ve.
# Ojo: hay una sola vista previa; la última rama que se publica pisa a las demás. No toca main ni Netlify.
name: Vista previa V2

on:
  push:
    branches: [v2-social]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://frankolascui.github.io/Excelsior/
      - name: Copia en la rama gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Vista previa de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

