# Comprueba tipos, tests y build en cada push a main y a v2-social. La web se publica en Netlify.
name: CI

on:
  push:
    branches: [main, v2-social]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
